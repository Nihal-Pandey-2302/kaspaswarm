<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KaspaSwarm — Real-Time AI Agent Coordination on Kaspa</title>

    <!-- Premium type: Inter for UI, JetBrains Mono for numerics/addresses/tx ids -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      body {
        font-family: var(--font-ui);
        color: #f3f5f8;
        overflow: hidden;
        /* Cinematic dark canvas with subtle depth behind the 3D scene */
        background:
          radial-gradient(1200px 800px at 50% -10%, rgba(0, 255, 136, 0.06), transparent 60%),
          radial-gradient(1000px 700px at 110% 110%, rgba(79, 158, 255, 0.06), transparent 55%),
          #06070a;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Inter for all UI (overrides components' inline system-font stacks)… */
      #root :not([style*="monospace"]) { font-family: var(--font-ui) !important; }
      /* …and JetBrains Mono for every monospace usage (numbers, addresses, tx ids) */
      [style*="monospace"] { font-family: var(--font-mono) !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
