name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Backend tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements-dev.txt
      - name: Run tests
        run: python -m pytest backend/tests -q

  build:
    name: Docker build (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t kaspaswarm-backend .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t kaspaswarm-frontend .
